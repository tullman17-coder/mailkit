name: Mailkit
options:
  bundleIdPrefix: org.zermo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: org.zermo.mailkit
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 1
targets:
  Mailkit:
    type: application
    platform: iOS
    sources:
      - Mailkit
    info:
      path: Mailkit/Info.plist
      properties:
        CFBundleDisplayName: Mailkit
        CFBundleURLTypes:
          - CFBundleURLName: org.zermo.mailkit.pair
            CFBundleURLSchemes:
              - mailkit
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
    settings:
      base:
        INFOPLIST_FILE: Mailkit/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.zermo.mailkit
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
