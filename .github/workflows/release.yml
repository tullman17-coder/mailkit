name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require signing secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$APPLE_NOTARY_KEY" ]; then
            echo "Missing MACOS_CERTIFICATE / APPLE_NOTARY_KEY."
            echo "Unsigned Mac builds are not published. See docs/SIGNING.md."
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERT="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/mailkit.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          security find-identity -v -p codesigning

      - name: Build, sign, notarize DMG
        env:
          MAILKIT_VERSION: ${{ github.ref_name }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          REQUIRE_SIGN: "1"
        run: bash scripts/build-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailkit-macos-dmg
          path: dist-dmg/*.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-dmg/*.dmg
          generate_release_notes: true
          body: |
            Local Mailkit for macOS (Developer ID signed and notarized).

            Download `Mailkit-*.dmg`, drag to Applications, open.

            The engine stays on this Mac and talks directly to your IMAP/SMTP
            providers. Credentials are encrypted in `~/.mailkit`.
